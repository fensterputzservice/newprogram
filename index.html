<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Do</title>
<style>
/* ============================================================
   Grundfarben. Werden beim Betreten einer Firma zur Laufzeit
   aus firmen.design überschrieben – siehe kern/mandant.js.
   ============================================================ */
:root{
  --petrol:#6d28d9; --petrol-dark:#4c1d95; --petrol-soft:#f0e9ff;
  --amber:#ff6b9d;  --amber-soft:#ffe4ee;
  --ink:#1f1633;    --muted:#6b6480;
  --line:#e8e2f5;   --bg:#f7f5fc;  --card:#ffffff;
  --good:#16a34a;   --good-soft:#dcfce7;
  --danger:#e11d48; --danger-soft:#ffe4e9;
  --radius:14px;
  --schatten:0 1px 3px rgba(31,22,51,.08), 0 8px 24px rgba(31,22,51,.06);
}

*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--petrol)}

.verborgen{display:none !important}

/* ---------- Knöpfe ---------- */
.knopf{
  background:var(--petrol); color:#fff; padding:11px 18px;
  border-radius:10px; font-weight:600; font-size:15px;
  transition:filter .15s, transform .05s;
}
.knopf:hover{filter:brightness(1.08)}
.knopf:active{transform:translateY(1px)}
.knopf:disabled{opacity:.5;cursor:not-allowed}
.knopf.stumm{background:var(--petrol-soft);color:var(--petrol-dark)}

/* ---------- Eingaben ---------- */
.feld{
  width:100%; padding:11px 13px; border:1px solid var(--line);
  border-radius:10px; background:var(--card); outline:none;
  transition:border-color .15s, box-shadow .15s;
}
.feld:focus{border-color:var(--petrol); box-shadow:0 0 0 3px var(--petrol-soft)}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}

/* ============================================================
   Anmeldung
   ============================================================ */
#anmeldung{
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:24px; background:linear-gradient(160deg,var(--petrol-soft),var(--bg) 55%);
}
.anmelde-karte{
  width:100%; max-width:380px; background:var(--card);
  border-radius:20px; padding:34px; box-shadow:var(--schatten);
}
.marke{font-size:26px;font-weight:800;letter-spacing:-.5px}
.marke span{color:var(--petrol)}

/* ============================================================
   Firmenauswahl – die zwei Kacheln
   ============================================================ */
#firmenwahl{min-height:100vh;padding:56px 24px;background:var(--bg)}
.wahl-innen{max-width:820px;margin:0 auto}
.kacheln{
  display:grid; gap:20px; margin-top:32px;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
}
.kachel{
  position:relative; overflow:hidden; text-align:left;
  background:var(--card); border:1px solid var(--line);
  border-radius:var(--radius); padding:28px;
  box-shadow:var(--schatten);
  transition:transform .16s, box-shadow .16s;
}
.kachel:hover{transform:translateY(-3px);box-shadow:0 6px 14px rgba(31,22,51,.1),0 16px 40px rgba(31,22,51,.1)}
/* Der Farbstreifen macht auf einen Blick klar, welche Firma man betritt. */
.kachel-streifen{position:absolute;inset:0 auto 0 0;width:6px}
.kachel-name{font-size:20px;font-weight:700;margin-bottom:4px}
.kachel-firma{font-size:13px;color:var(--muted)}
.kachel-rolle{
  display:inline-block; margin-top:16px; padding:4px 10px;
  border-radius:99px; font-size:12px; font-weight:700;
}

/* ============================================================
   Anwendung
   ============================================================ */
#anwendung{display:flex;min-height:100vh}

.seitenleiste{
  width:248px; flex-shrink:0; background:var(--card);
  border-right:1px solid var(--line); padding:18px 12px;
  display:flex; flex-direction:column; gap:2px;
  position:sticky; top:0; height:100vh; overflow-y:auto;
}
.leiste-kopf{padding:6px 10px 18px}
.leiste-firma{font-size:15px;font-weight:700;line-height:1.25}
.leiste-rolle{font-size:12px;color:var(--muted);margin-top:2px}

.navpunkt{
  display:flex; align-items:center; gap:10px; width:100%;
  padding:10px 12px; border-radius:9px; font-size:14.5px;
  font-weight:600; color:var(--muted); text-align:left;
  transition:background .12s, color .12s;
}
.navpunkt:hover{background:var(--petrol-soft);color:var(--petrol-dark)}
.navpunkt.aktiv{background:var(--petrol);color:#fff}
.navpunkt .zeichen{width:18px;text-align:center;font-size:15px}
.navpunkt.unter{padding-left:40px;font-size:13.5px;font-weight:500}
.nav-pfeil{margin-left:auto;font-size:11px;opacity:.6;transition:transform .16s}
.nav-pfeil.auf{transform:rotate(90deg)}

.inhalt{flex:1;min-width:0;display:flex;flex-direction:column}
.kopfzeile{
  display:flex; align-items:center; gap:14px;
  padding:14px 26px; background:var(--card);
  border-bottom:1px solid var(--line);
  position:sticky; top:0; z-index:5;
}
.kopf-titel{font-size:17px;font-weight:700}
.kopf-rechts{margin-left:auto;display:flex;align-items:center;gap:8px}
.wechsler{
  display:flex; align-items:center; gap:8px;
  padding:7px 12px; border:1px solid var(--line);
  border-radius:99px; font-size:13.5px; font-weight:600;
}
.wechsler:hover{border-color:var(--petrol);color:var(--petrol)}
.punkt{width:9px;height:9px;border-radius:50%;flex-shrink:0}

.buehne{padding:26px;flex:1}
.karte{
  background:var(--card); border:1px solid var(--line);
  border-radius:var(--radius); padding:24px; box-shadow:var(--schatten);
}

/* Platzhalter der noch nicht portierten Module */
.platzhalter{text-align:center;padding:56px 24px;color:var(--muted)}
.platzhalter .zeichen{font-size:40px;display:block;margin-bottom:14px;opacity:.5}
.platzhalter h2{color:var(--ink);font-size:19px;margin-bottom:8px}
.platzhalter code{
  background:var(--petrol-soft); color:var(--petrol-dark);
  padding:2px 7px; border-radius:6px; font-size:13px;
}

/* ---------- Hinweise ---------- */
#hinweise{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px}
.hinweis{
  background:var(--ink); color:#fff; padding:11px 18px;
  border-radius:10px; font-size:14px; font-weight:500;
  box-shadow:var(--schatten); animation:auf .2s ease-out;
}
.hinweis.schlecht{background:var(--danger)}
@keyframes auf{from{opacity:0;transform:translateY(8px)}}

.warnstreifen{
  background:var(--amber-soft); color:var(--ink);
  padding:9px 26px; font-size:13px; font-weight:600;
  border-bottom:1px solid var(--line);
}

@media(max-width:760px){
  .seitenleiste{position:fixed;left:-248px;z-index:20;transition:left .2s;box-shadow:var(--schatten)}
  .seitenleiste.offen{left:0}
  .buehne{padding:16px}
  .kopfzeile{padding:12px 16px}
}
</style>
</head>
<body>

<!-- ============ Anmeldung ============ -->
<section id="anmeldung" class="verborgen">
  <div class="anmelde-karte">
    <div class="marke">Daily<span>Do</span></div>
    <p style="color:var(--muted);font-size:14px;margin:6px 0 26px">Bitte anmelden</p>

    <form id="anmelde-form">
      <div style="margin-bottom:14px">
        <label for="an-email">E-Mail</label>
        <input class="feld" type="email" id="an-email" autocomplete="username" required>
      </div>
      <div style="margin-bottom:22px">
        <label for="an-pass">Passwort</label>
        <input class="feld" type="password" id="an-pass" autocomplete="current-password" required>
      </div>
      <button class="knopf" style="width:100%" type="submit" id="an-knopf">Anmelden</button>
    </form>

    <p style="margin-top:20px;font-size:12px;color:var(--muted);text-align:center">
      Testbetrieb ohne Datenbank: <b>admin@test.de</b> oder <b>mitarbeiter@test.de</b>,
      Passwort beliebig
    </p>
  </div>
</section>

<!-- ============ Firmenauswahl ============ -->
<section id="firmenwahl" class="verborgen">
  <div class="wahl-innen">
    <div style="display:flex;align-items:center;gap:14px">
      <div class="marke">Daily<span>Do</span></div>
      <button class="knopf stumm" id="wahl-abmelden" style="margin-left:auto;padding:8px 14px;font-size:13px">Abmelden</button>
    </div>
    <h1 style="font-size:25px;font-weight:800;margin-top:30px;letter-spacing:-.4px">Welche Firma?</h1>
    <p style="color:var(--muted);font-size:14.5px;margin-top:6px" id="wahl-untertitel"></p>
    <div class="kacheln" id="wahl-kacheln"></div>
  </div>
</section>

<!-- ============ Anwendung ============ -->
<section id="anwendung" class="verborgen">
  <nav class="seitenleiste" id="seitenleiste">
    <div class="leiste-kopf">
      <div class="marke" style="font-size:19px">Daily<span>Do</span></div>
      <div class="leiste-firma" id="leiste-firma" style="margin-top:12px"></div>
      <div class="leiste-rolle" id="leiste-rolle"></div>
    </div>
    <div id="nav"></div>
    <button class="navpunkt" id="abmelden" style="margin-top:auto">
      <span class="zeichen">⏻</span> Abmelden
    </button>
  </nav>

  <div class="inhalt">
    <div class="warnstreifen verborgen" id="demo-streifen">
      Testbetrieb — Beispieldaten im Browser, keine Verbindung zur Datenbank
    </div>
    <header class="kopfzeile">
      <button class="knopf stumm" id="leiste-schalter" style="padding:7px 11px">☰</button>
      <div class="kopf-titel" id="kopf-titel"></div>
      <div class="kopf-rechts">
        <button class="wechsler" id="wechsler">
          <span class="punkt" id="wechsler-punkt"></span>
          <span id="wechsler-name"></span>
          <span style="opacity:.5">⇄</span>
        </button>
      </div>
    </header>
    <main class="buehne" id="buehne"></main>
  </div>
</section>

<div id="hinweise"></div>

<script type="module" src="./src/app.js"></script>
</body>
</html>
